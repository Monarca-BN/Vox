<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="Comentarios reales de X, filtrados." />
    <title>Vox</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/icon-192.png" alt="" width="40" height="40" />
        <div>
          <h1>Vox</h1>
          <p class="tema">Monitoreando X sobre <strong id="tema"></strong></p>
        </div>
      </div>
      <div class="status">
        <span id="fuente" class="pill">live</span>
        <span id="meta" class="meta">Cargando comentarios…</span>
      </div>
    </header>
    <section id="banner" class="banner hidden" role="status"></section>
    <section class="filters" aria-label="Filtros de comentarios">
      <label>
        Severidad
        <select id="filtro-severity">
          <option value="">Todas</option>
          <option value="high">Alta</option>
          <option value="medium">Media</option>
          <option value="low">Baja</option>
        </select>
      </label>
      <label>
        Tipo
        <select id="filtro-es_bug">
          <option value="">Todos</option>
          <option value="true">Bug</option>
          <option value="false">Feature</option>
        </select>
      </label>
      <label>
        Feature
        <input id="filtro-feature" type="text" placeholder="ej. latencia" autocomplete="off" />
      </label>
      <button type="button" id="aplicar-filtros">Filtrar</button>
    </section>
    <main id="feed" class="feed" aria-live="polite"></main>
    <section class="tickets-wrap" aria-label="Tickets fingidos">
      <div class="tickets-head">
        <h2>Tickets fingidos</h2>
        <span id="tickets-meta" class="meta">Ninguno todavía</span>
      </div>
      <div id="tickets" class="tickets"></div>
    </section>
    <script src="/app.js"></script>
  </body>
</html>
